name: p3l_mobile
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.5.0
  flutter_svg: ^2.0.7
  shared_preferences: ^2.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_animate: ^4.2.0
  flutter_native_splash: ^2.4.4
  animate_do: ^3.3.4 # For animations
  shimmer: ^3.0.0 # For shimmer loading effect
  intl: ^0.18.0
  fl_chart: ^0.68.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/images/logobig.png
    - assets/images/splash.png
    - assets/images/splash_12.png
    - assets/images/hero-bg.png
    - assets/images/hero-bg.jpg

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700

    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins-regular.ttf
          weight: 400
        - asset: assets/fonts/poppins-bold.ttf
          weight: 700
